[workspace]
members = ["crates/catch-core", "crates/catch-storage", "crates/catch-app"]
exclude = ["artifacts/tauri-prototype/src-tauri", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
