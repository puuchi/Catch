name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare Rust checks
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build Tauri Windows x64 installer
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/tauri-ci-target
        run: .\frontend\node_modules\.bin\tauri.cmd build --ci --no-sign --target x86_64-pc-windows-msvc -- --locked
      - name: Generate Tauri installer checksum
        run: |
          $bundle = 'artifacts/tauri-ci-target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -File -Filter '*_x64-setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one Tauri x64 installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath (Join-Path $bundle 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload Tauri Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: Catch-Tauri-Windows-x64
          if-no-files-found: error
          path: |
            artifacts/tauri-ci-target/x86_64-pc-windows-msvc/release/bundle/nsis/*_x64-setup.exe
            artifacts/tauri-ci-target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt
  verify:
    name: Website build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Build demo website
        run: node site/tools/build.cjs
      - name: Test demo state
        run: node --test site/test/*.test.cjs
      - name: Upload demo website
        uses: actions/upload-artifact@v4
        with:
          name: Catch-Demo-site
          if-no-files-found: error
          path: |
            site/index.html
            site/app.js
            site/app.css
            site/assets/
            site/desktop-demo/
