name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare Rust checks
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: node tools/rust-licenses.cjs
      - run: npm --prefix frontend run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Build demo website
        run: node site/tools/build.cjs
      - name: Test demo state
        run: node --test site/test/*.test.cjs
      - run: npm run test:electron
      - run: npm run dist
      - name: Check packaged executable and legacy data migration
        run: node test/packaged.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Catch-Windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Upload demo website
        uses: actions/upload-artifact@v4
        with:
          name: Catch-Demo-site
          if-no-files-found: error
          path: |
            site/index.html
            site/app.js
            site/app.css
            site/assets/
