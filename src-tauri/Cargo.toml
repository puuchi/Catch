[package]
name = "catch-next"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
catch-app = {path="../crates/catch-app"}
catch-core = {path="../crates/catch-core"}
catch-storage = {path="../crates/catch-storage"}
tauri = {version="=2.12.5",features= ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = {version="1",features= ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = {version="1",features= ["v4"] }
png = "0.18"
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
